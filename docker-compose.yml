# Production-like app container. The database is external (Neon): set
# DATABASE_URL (and optionally DIRECT_DATABASE_URL) in .env or in the shell.
#
#   cp .env.example .env       # fill SECRET_KEY, DATABASE_URL, etc.
#   docker compose up --build
#
# For a fully local PostgreSQL instead, use the optional "local-db" profile:
#   DATABASE_URL=postgres://postgres:postgres@db:5432/liga_efootball \
#     docker compose --profile local-db up --build
#
# The host port is configurable with APP_PORT (default 8000).
services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Keep DEBUG=False for anything that is not a throwaway local test.
      # With DEBUG=True the session cookies are not Secure and are served over
      # plain HTTP; only do that on localhost.
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env ou no ambiente}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL do Neon no .env ou no ambiente}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-dev.cesar26@gmail.com}
      DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-300}
      NUM_PROXIES: ${NUM_PROXIES:-0}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Biblioteca <dev.cesar26@gmail.com>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      PASSWORD_RESET_TIMEOUT: ${PASSWORD_RESET_TIMEOUT:-3600}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional database for local development only. It is not started by
  # "docker compose up" unless the "local-db" profile is enabled.
  db:
    image: postgres:15
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: liga_efootball
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - liga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liga_efootball"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  liga_pgdata:
